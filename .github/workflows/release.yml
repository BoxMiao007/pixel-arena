# 三端打包发布（T16，决策 0014）：tag 推送（v*）时构建 Windows / Linux / macOS
# 安装产物并上传为 workflow artifacts；同时把仓库内锚定的编码器工件上传到
# GitHub Release encoders-v1（一站式模式首次使用时从该 Release 下载，见决策 0009）。
#
# 初期不签名（验收口径）：Windows 安装包会触发 SmartScreen 提示、macOS 需右键打开
# 绕过 Gatekeeper，已知限制写在 README。
#
# 产物清单：
# - Windows：NSIS 安装包 + MSI 安装包 + 便携 exe（target/release/pixel-arena.exe，
#   双击可用，WebView2 依赖 Win10/11 自带）
# - Linux：deb + AppImage
# - macOS：dmg + .app（目录，upload-artifact 自动打包成 zip）
#
# T29-4 修订（决策 0014）：四个内置编码器（cjpeg/cwebp/avifenc/cjxl 及 avifdec）
# 捆绑进三端安装包（约 +10~20MB）：构建前由 scripts/bundle-encoders.* 按平台
# 下载锁定工件（sha256 校验，与 encode.rs 清单同源）解到 src-tauri/resources/encoders/，
# tauri.conf.json 的 bundle.resources 把它打进包（应用内只读，「内置 + 版本号」）。
# ffmpeg 不捆绑（约 40MB）：下载入口收敛到设置页「应用内下载」（ffmpeg_download IPC）。
# 捆绑缺失/损坏时应用仍可回退「下载到 tools/」路径（encoders-release job 维持）。

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # encoders-release job 需要创建/上传 Release

jobs:
  # ---------- 三端安装产物 ----------
  build:
    strategy:
      fail-fast: false # 一端失败不让其他端的产物作废
      matrix:
        include:
          - os: windows-latest
            bundles: "nsis,msi"
          - os: ubuntu-latest
            bundles: "deb,appimage"
          - os: macos-latest
            bundles: "dmg,app"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Tauri v2 官方文档列出的 Ubuntu 构建依赖（webkit2gtk-4.1 等）
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev unzip ninja-build

      # T29-4：捆绑编码器（下载/构建锁定工件 → 解出成员到 src-tauri/resources/encoders/）
      - name: 捆绑编码器（Linux）
        if: runner.os == 'Linux'
        run: bash scripts/bundle-encoders.sh

      - name: 捆绑编码器（Windows）
        if: runner.os == 'Windows'
        run: ./scripts/bundle-encoders.ps1

      - name: 捆绑编码器（macOS）
        if: runner.os == 'macOS'
        run: bash scripts/bundle-encoders.sh

      - name: 安装前端依赖
        run: npm install

      # beforeBuildCommand（tsc + vite build）由 tauri CLI 自动执行。
      # 产物在仓库根 target/（Cargo workspace 布局，tauri CLI 检测到 workspace root），
      # 不是 src-tauri/target/——首次 CI 真跑时上传路径写错，三端产物上传全挂过。
      - name: 构建安装产物
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # T29-4：产物包含性验证——编码器必须随包（deb 解包核对；NSIS/MSI/AppImage
      # 的资源由同一 resources 目录产出，此处核对源目录即可）
      - name: 验证产物包含捆绑编码器（Linux）
        if: runner.os == 'Linux'
        run: |
          for m in cjpeg cwebp avifenc avifdec cjxl; do
            dpkg-deb -c target/release/bundle/deb/*.deb | grep -q "encoders/$m" || { echo "deb 缺编码器 $m"; exit 1; }
          done
          echo "---- 产物体积 ----"
          ls -lh target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage

      - name: 验证产物包含捆绑编码器（Windows）
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path 'src-tauri\resources\encoders\cjpeg.exe')) { throw 'cjpeg.exe 未捆绑' }
          if (-not (Test-Path 'src-tauri\resources\encoders\cwebp.exe')) { throw 'cwebp.exe 未捆绑' }
          if (-not (Test-Path 'src-tauri\resources\encoders\avifenc.exe')) { throw 'avifenc.exe 未捆绑' }
          if (-not (Test-Path 'src-tauri\resources\encoders\avifdec.exe')) { throw 'avifdec.exe 未捆绑' }
          if (-not (Test-Path 'src-tauri\resources\encoders\cjxl.exe')) { throw 'cjxl.exe 未捆绑' }
          Get-ChildItem 'target\release\bundle\nsis\*.exe', 'target\release\bundle\msi\*.msi' | Format-Table Name, Length

      - name: 验证产物包含捆绑编码器（macOS）
        if: runner.os == 'macOS'
        run: |
          app_encoders="$(echo target/release/bundle/macos/*.app)/Contents/Resources/encoders"
          for m in cjpeg cwebp avifenc avifdec cjxl; do
            test -x "$app_encoders/$m" || { echo "产物缺编码器 $m"; exit 1; }
          done
          echo "---- 产物体积 ----"
          ls -lh target/release/bundle/dmg/*.dmg

      - name: 上传 Windows 产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pixel-arena-windows
          path: |
            target/release/pixel-arena.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: 上传 Linux 产物
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pixel-arena-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: 上传 macOS 产物
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pixel-arena-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error

  # ---------- 编码器工件上传 Release encoders-v1 ----------
  # 一站式模式首次使用时从本 Release 下载编码器（决策 0009）。工件入库
  # assets/encoders/（sha256 与 crates/pixel-arena-core/src/encode.rs 的清单锚定一致），
  # 这里原样上传，保证「安装包里的清单哈希 = Release 资产哈希」，无回填环节。
  # libwebp/libjxl/ffmpeg 的条目直连官方版本化 URL，不经本 Release。
  encoders-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 资产缺失时上传 encoders-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd assets/encoders
          # 期望资产 = 本目录全部文件（文件名即清单锚定的下载名）
          missing=0
          for f in *; do
            if ! gh release view encoders-v1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$f"; then
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "encoders-v1 资产齐全，跳过上传"
            exit 0
          fi
          gh release view encoders-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create encoders-v1 --repo "$GITHUB_REPOSITORY" \
              --title "编码器工件 v1（决策 0009/0012 清单）" \
              --notes "一站式模式首次使用时下载的编码器工件。sha256 清单锚定在代码仓库 crates/pixel-arena-core/src/encode.rs，升级须换 URL + 哈希一起改。"
          for f in *; do
            sha256sum "$f"
            gh release upload encoders-v1 "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
