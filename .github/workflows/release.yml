# 三端打包发布（T16，决策 0014）：tag 推送（v*）时构建 Windows / Linux / macOS
# 安装产物并上传为 workflow artifacts；同时把仓库内锚定的编码器工件上传到
# GitHub Release encoders-v1（一站式模式首次使用时从该 Release 下载，见决策 0009）。
#
# 初期不签名（验收口径）：Windows 安装包会触发 SmartScreen 提示、macOS 需右键打开
# 绕过 Gatekeeper，已知限制写在 README。
#
# 产物清单：
# - Windows：NSIS 安装包 + MSI 安装包 + 便携 zip（Pixel-Arena_<版本>_x64-portable.zip，
#   票 #43：解开为 PixelArena/ 目录，内含 pixel-arena.exe + encoders/ 五编码器，解压即用免安装；
#   票 #46：zip 文件名对齐安装包「产品名_版本_架构」参数口径；WebView2 依赖 Win10/11 自带）
# - Linux：deb + AppImage
# - macOS：dmg + .app（目录，upload-artifact 自动打包成 zip）
#
# T29-4 修订（决策 0014）：四个内置编码器（cjpeg/cwebp/avifenc/cjxl 及 avifdec）
# 捆绑进三端安装包（约 +10~20MB）：构建前由 scripts/bundle-encoders.* 按平台
# 下载锁定工件（sha256 校验，与 encode.rs 清单同源）解到 src-tauri/resources/encoders/，
# tauri.conf.json 的 bundle.resources 把它打进包（应用内只读，「内置 + 版本号」）。
# ffmpeg 不捆绑（约 40MB）：下载入口收敛到设置页「应用内下载」（ffmpeg_download IPC）。
# 捆绑缺失/损坏时应用仍可回退「下载到 tools/」路径（encoders-release job 维持）。

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # encoders-release job 需要创建/上传 Release

jobs:
  # ---------- 三端安装产物 ----------
  build:
    strategy:
      fail-fast: false # 一端失败不让其他端的产物作废
      matrix:
        include:
          - os: windows-latest
            bundles: "nsis,msi"
          - os: ubuntu-latest
            bundles: "deb,appimage"
          - os: macos-latest
            bundles: "dmg,app"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Tauri v2 官方文档列出的 Ubuntu 构建依赖（webkit2gtk-4.1 等）
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev unzip ninja-build

      # T29-4：捆绑编码器（下载/构建锁定工件 → 解出成员到 src-tauri/resources/encoders/）
      - name: 捆绑编码器（Linux）
        if: runner.os == 'Linux'
        run: bash scripts/bundle-encoders.sh

      - name: 捆绑编码器（Windows）
        if: runner.os == 'Windows'
        run: ./scripts/bundle-encoders.ps1

      - name: 捆绑编码器（macOS）
        if: runner.os == 'macOS'
        run: bash scripts/bundle-encoders.sh

      - name: 安装前端依赖
        run: npm install

      # beforeBuildCommand（tsc + vite build）由 tauri CLI 自动执行。
      # 产物在仓库根 target/（Cargo workspace 布局，tauri CLI 检测到 workspace root），
      # 不是 src-tauri/target/——首次 CI 真跑时上传路径写错，三端产物上传全挂过。
      - name: 构建安装产物
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # 票 #43：组装 Windows 便携 zip——解开为 PixelArena/ 目录（exe + encoders/
      # 五编码器，解压即用免安装），取代裸 exe 上传（Release 资产总数不变）。
      # Windows runner 自带 bsdtar（tar -a 按后缀选 zip 格式），条目保留目录层级。
      # 票 #46：zip 文件名带「产品名_版本_架构-portable」参数（版本读 tauri.conf.json，
      # 单一数据源随发版自增），写入 GITHUB_ENV 供核对 / 上传步骤复用，不双写散落。
      - name: 组装 Windows 便携包
        if: runner.os == 'Windows'
        run: |
          $version = (Get-Content 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json).version
          $zip = "Pixel-Arena_${version}_x64-portable.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "PORTABLE_ZIP=$zip"
          New-Item -ItemType Directory -Path 'PixelArena\encoders' -Force | Out-Null
          Copy-Item 'target\release\pixel-arena.exe' 'PixelArena\'
          Copy-Item 'src-tauri\resources\encoders\*.exe' 'PixelArena\encoders\'
          tar -a -c -f $zip PixelArena

      # T29-4：产物包含性验证。票 #43 起逐产物解包后逐成员核对（deb / macOS .app /
      # AppImage / NSIS / MSI / 便携 zip），禁止「任一匹配即过」——每个成员单独判断，
      # 缺任一即显式非 0 退出让 job 红。
      - name: 验证产物包含捆绑编码器（Linux）
        if: runner.os == 'Linux'
        run: |
          for m in cjpeg cwebp avifenc avifdec cjxl; do
            dpkg-deb -c target/release/bundle/deb/*.deb | grep -q "encoders/$m" || { echo "deb 缺编码器 $m"; exit 1; }
          done
          # AppImage 解包逐成员核对（--appimage-extract 免 FUSE，解到 squashfs-root/）
          appimage=$(echo target/release/bundle/appimage/*.AppImage)
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          for m in cjpeg cwebp avifenc avifdec cjxl; do
            hit="$(find squashfs-root -type f -path "*/encoders/${m}" -print -quit)"
            if [ -z "$hit" ]; then
              echo "AppImage 缺编码器 ${m}"
              exit 1
            fi
            echo "AppImage 含编码器 ${hit}"
          done
          rm -rf squashfs-root
          echo "---- 产物体积 ----"
          ls -lh target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage

      - name: 验证产物包含捆绑编码器（Windows）
        if: runner.os == 'Windows'
        run: |
          # 源目录逐成员核对（bundle-encoders.ps1 就位，全部包资源的共同来源）
          $members = @('cjpeg.exe', 'cwebp.exe', 'avifenc.exe', 'avifdec.exe', 'cjxl.exe')
          foreach ($m in $members) {
            if (-not (Test-Path "src-tauri\resources\encoders\$m")) { throw "编码器未捆绑：$m" }
          }
          # 便携 zip 逐成员核对（含目录层级：解开必须是 PixelArena/ 下；条目分隔符
          # 统一成正斜杠再比对，不赌 bsdtar 的存储习惯；zip 名由组装步骤经
          # GITHUB_ENV 传入，票 #46）
          $zipEntries = tar -tf $env:PORTABLE_ZIP | ForEach-Object { $_ -replace '\\', '/' }
          $zipMembers = @('PixelArena/pixel-arena.exe') + ($members | ForEach-Object { "PixelArena/encoders/$_" })
          foreach ($m in $zipMembers) {
            if ($zipEntries -notcontains $m) { throw "便携包缺成员 $m" }
          }
          echo "---- 便携包成员 ----"
          $zipEntries | ForEach-Object { echo $_ }
          # NSIS / MSI 解包逐成员核对。NSIS 用 7z（能还原安装器文件名）；MSI 不能用
          # 7z——实测（7-Zip 26.00）只还原 cabinet 内部键名（Path/PathFile_<GUID>），
          # 不按 File 表还原安装路径，改用 Windows 原生 msiexec /a 管理镜像解包。
          # 路径级核对：成员必须落在某个 encoders 目录下、全树唯一且非空——
          # 按裸文件名在任意目录命中即过（「任一匹配即过」）是被禁止的写法。
          function Assert-EncoderMembers([string]$extractDir, [string]$artifact) {
            foreach ($m in $members) {
              $hits = @(Get-ChildItem -Recurse -File $extractDir -Filter $m |
                Where-Object { $_.FullName -match '[\\/]encoders[\\/]' })
              if ($hits.Count -eq 0) { throw "$artifact 缺编码器 $m（未在任何 encoders 目录下找到）" }
              if ($hits.Count -gt 1) { throw "$artifact 编码器 $m 出现 $($hits.Count) 处（歧义，需人工核对）" }
              if ($hits[0].Length -eq 0) { throw "$artifact 编码器 $m 是空文件" }
            }
            echo "---- $artifact 编码器成员 ----"
            Get-ChildItem -Recurse -File $extractDir | Where-Object { $_.FullName -match '[\\/]encoders[\\/]' } | ForEach-Object { echo $_.FullName }
          }
          $nsis = (Resolve-Path 'target\release\bundle\nsis\*.exe').Path
          7z x -y -o"_verify_nsis" $nsis | Out-Null
          Assert-EncoderMembers '_verify_nsis' 'NSIS 安装包'
          $msi = (Resolve-Path 'target\release\bundle\msi\*.msi').Path
          $msiDir = Join-Path $env:RUNNER_TEMP 'verify-msi'
          $proc = Start-Process msiexec.exe -ArgumentList "/a", "`"$msi`"", "TARGETDIR=`"$msiDir`"", "/qn" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "msiexec 管理镜像解包失败（ExitCode=$($proc.ExitCode)）" }
          Assert-EncoderMembers $msiDir 'MSI 安装包'
          echo "---- 产物体积 ----"
          Get-ChildItem 'target\release\bundle\nsis\*.exe', 'target\release\bundle\msi\*.msi', $env:PORTABLE_ZIP | Format-Table Name, Length

      - name: 验证产物包含捆绑编码器（macOS）
        if: runner.os == 'macOS'
        run: |
          app_encoders="$(echo target/release/bundle/macos/*.app)/Contents/Resources/encoders"
          for m in cjpeg cwebp avifenc avifdec cjxl; do
            test -x "$app_encoders/$m" || { echo "产物缺编码器 $m"; exit 1; }
          done
          echo "---- 产物体积 ----"
          ls -lh target/release/bundle/dmg/*.dmg

      - name: 上传 Windows 产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pixel-arena-windows
          path: |
            ${{ env.PORTABLE_ZIP }}
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: 上传 Linux 产物
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pixel-arena-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: 上传 macOS 产物
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pixel-arena-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error

  # ---------- 编码器工件上传 Release encoders-v1 ----------
  # 一站式模式首次使用时从本 Release 下载编码器（决策 0009）。工件入库
  # assets/encoders/（sha256 与 crates/pixel-arena-core/src/encode.rs 的清单锚定一致），
  # 这里原样上传，保证「安装包里的清单哈希 = Release 资产哈希」，无回填环节。
  # libwebp/libjxl/ffmpeg 的条目直连官方版本化 URL，不经本 Release。
  encoders-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 资产缺失时上传 encoders-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd assets/encoders
          # 期望资产 = 本目录全部文件（文件名即清单锚定的下载名）
          missing=0
          for f in *; do
            if ! gh release view encoders-v1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$f"; then
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "encoders-v1 资产齐全，跳过上传"
            exit 0
          fi
          gh release view encoders-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create encoders-v1 --repo "$GITHUB_REPOSITORY" \
              --title "编码器工件 v1（决策 0009/0012 清单）" \
              --notes "一站式模式首次使用时下载的编码器工件。sha256 清单锚定在代码仓库 crates/pixel-arena-core/src/encode.rs，升级须换 URL + 哈希一起改。"
          for f in *; do
            sha256sum "$f"
            gh release upload encoders-v1 "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
