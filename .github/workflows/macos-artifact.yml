# macOS 编码器工件自建（缺口 2 补齐，issue #33 的后续）：MozJPEG / libwebp / libjxl
# 官方均无 macOS 预编译工件（2026-10-07 核实：MozJPEG Release 无资产、libwebp 下载站
# 无 macos 包、libjxl 各版本只有 linux/windows），CI macos runner（arm64）原生构建。
#
# 为什么在 CI 构建：用户机器性能不足，本地构建被明确排除（2026-10-07）。
# workflow_dispatch 手动触发，调试迭代不占 tag。工件下载回本地算哈希后
# encode.rs 补 macOS 条目（哈希锚定入库工件，release.yml 的 encoders-release
# 原样上传 Release encoders-v1 保持恒等）。
#
# 构建配置与 Linux/Windows 工件同标准：无 SIMD（MozJPEG）、全静态、仅依赖系统库。

name: macos-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具
        run: brew install ninja

      # ---------- MozJPEG 4.1.5 → cjpeg（无 SIMD、静态，与 Linux/Windows 工件同配置） ----------
      - name: 构建 MozJPEG cjpeg
        run: |
          curl -sL -o mozjpeg.tar.gz https://github.com/mozilla/mozjpeg/archive/refs/tags/v4.1.5.tar.gz
          tar -xzf mozjpeg.tar.gz
          cmake -S mozjpeg-4.1.5 -B mozjpeg-build -G Ninja \
            -DWITH_SIMD=0 -DPNG_SUPPORT=0 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build mozjpeg-build --target cjpeg
          mkdir -p artifact-mozjpeg
          cp mozjpeg-build/cjpeg artifact-mozjpeg/
          tar -czf mozjpeg-v4.1.5-macos-arm64.tar.gz -C artifact-mozjpeg cjpeg

      # ---------- libwebp 1.6.0 → cwebp（静态） ----------
      - name: 构建 libwebp cwebp
        run: |
          curl -sL -o libwebp.tar.gz https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0.tar.gz
          tar -xzf libwebp.tar.gz
          cmake -S libwebp-1.6.0 -B libwebp-build -G Ninja \
            -DWEBP_BUILD_CWEBP=ON -DBUILD_SHARED_LIBS=OFF \
            -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF \
            -DWEBP_BUILD_WEBPINFO=OFF -DWEBP_BUILD_WEBPMUX=OFF -DWEBP_BUILD_DWEBP=OFF \
            -DWEBP_BUILD_WEBPQUALITY=OFF -DWEBP_BUILD_GET_DISTO=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build libwebp-build --target cwebp
          mkdir -p artifact-webp
          cp libwebp-build/cwebp artifact-webp/
          tar -czf libwebp-1.6.0-macos-arm64.tar.gz -C artifact-webp cwebp

      # ---------- libjxl 0.11.1 → cjxl（静态；构建最重，放最后） ----------
      - name: 构建 libjxl cjxl
        run: |
          curl -sL -o libjxl.tar.gz https://github.com/libjxl/libjxl/archive/refs/tags/v0.11.1.tar.gz
          tar -xzf libjxl.tar.gz
          cmake -S libjxl-0.11.1 -B libjxl-build -G Ninja \
            -DBUILD_SHARED_LIBS=OFF -DJPEGXL_ENABLE_TOOLS=ON \
            -DJPEGXL_ENABLE_BENCHMARK=OFF -DJPEGXL_ENABLE_EXAMPLES=OFF \
            -DJPEGXL_ENABLE_MANPAGES=OFF -DJPEGXL_ENABLE_JNI=OFF \
            -DJPEGXL_ENABLE_SJPEG=OFF -DJPEGXL_ENABLE_OPENEXR=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build libjxl-build --target cjxl
          mkdir -p artifact-jxl
          cp libjxl-build/tools/cjxl artifact-jxl/
          tar -czf libjxl-v0.11.1-macos-arm64.tar.gz -C artifact-jxl cjxl

      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: encoders-macos
          path: |
            mozjpeg-v4.1.5-macos-arm64.tar.gz
            libwebp-1.6.0-macos-arm64.tar.gz
            libjxl-v0.11.1-macos-arm64.tar.gz
          if-no-files-found: error
