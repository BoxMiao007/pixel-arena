# Windows AVIF 编码器工件自建（T28，issue #33，决策 0012/0014）：
# libavif 1.4.2 + libaom（vcpkg 静态 triplet）+ libpng + zlib 全静态，
# 产出 avifenc.exe / avifdec.exe 的 tar.gz 工件（workflow artifact）。
#
# 为什么在 CI 构建：用户机器性能不足，本地交叉编译被明确排除（2026-10-07）；
# windows runner 原生编译也免去 mingw 交叉的复杂度。workflow_dispatch 手动触发，
# 调试迭代不占 tag。工件下载回本地算哈希后入库 assets/encoders/ +
# encode.rs 补 Windows AVIF 条目（哈希锚定入库工件，release.yml 的 encoders-release
# 原样上传 Release encoders-v1 保持恒等，无回填循环）。

name: avif-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # libaom/libpng/zlib 用 vcpkg 静态 triplet（静态库 + /MT 运行时），
      # avifenc 链接后为全静态单文件（导入表仅系统 DLL）；
      # libjpeg-turbo 是 apps 的可选依赖（avifenc 读 JPEG 输入用，我们只喂 PNG，
      # 但缺了 cmake 配置会挂）
      - name: vcpkg 安装静态依赖
        run: vcpkg install --triplet x64-windows-static zlib libpng libjpeg-turbo aom

      - name: 下载 libavif 1.4.2 源码
        run: |
          curl -L -o libavif.tar.gz https://github.com/AOMediaCodec/libavif/archive/refs/tags/v1.4.2.tar.gz
          tar -xzf libavif.tar.gz
          mv libavif-1.4.2 libavif-src

      - name: cmake 构建 avifenc / avifdec
        run: |
          cmake -S libavif-src -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DBUILD_SHARED_LIBS=OFF `
            -DAVIF_BUILD_APPS=ON `
            -DAVIF_LIBYUV=OFF `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target avifenc avifdec

      - name: 打包工件（包内成员 avifenc.exe + avifdec.exe）
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build/Release/avifenc.exe artifact/
          Copy-Item build/Release/avifdec.exe artifact/
          dumpbin /dependents artifact/avifenc.exe
          tar -czf avif-v1.4.2-windows-x86_64.tar.gz -C artifact avifenc.exe avifdec.exe

      - uses: actions/upload-artifact@v4
        with:
          name: avif-windows
          path: avif-v1.4.2-windows-x86_64.tar.gz
          if-no-files-found: error
