[package]
name = "pixel-arena"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "像素竞技场桌面应用（Tauri 壳）"

[lib]
name = "pixel_arena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：asset protocol 让 WebView 直接读本地图片（对比查看器加载原图/跑分图）
tauri = { version = "2", features = ["protocol-asset"] }
pixel-arena-core = { path = "../crates/pixel-arena-core" }
tauri-plugin-dialog = "2.8.1"
# ffmpeg 静态构建下载（T14，决策 0010）：ureq 阻塞式 HTTP（rustls，无系统依赖），
# 显式复用系统代理环境变量；sha2 做下载完整性校验
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
