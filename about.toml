# cargo-about 配置：Rust crate 许可清单生成（决策 0047）
# 重新生成：
#   cargo about generate --workspace --config about.toml about.hbs \
#     -o src-tauri/resources/notices/crate-notices.md
# （需先安装：cargo install cargo-about --locked --features cli）
# 白名单只收宽松许可；生成时出现未列入的许可证会直接失败并列出 crate，
# 逐个核查后再决定是否加入——这是防止未来依赖混入不兼容许可的闸门。
# targets 不设：各平台 CI 按宿主目标生成各自的清单，随安装包分发。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "MPL-2.0",
    "MIT-0",
]
# 仅测试用的 dev 依赖不进可执行文件，不纳入清单
ignore-dev-dependencies = true
