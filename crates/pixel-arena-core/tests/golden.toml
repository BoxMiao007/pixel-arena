# 黄金基准：固定样例图的指标数值锚点，防止指标实现悄悄漂移。
# 数值来自本仓库实现入库时的实测（%.17e 全精度），测试按容差比对。
# 样例图由 scripts/generate_golden_samples.sh 生成，重造样例必须同步更新本文件。
#
# 容差依据（notes/T02.md、notes/T04.md 有完整论证）：
#   ssim        ±1e-9   —— 实现纯四则运算，跨平台位级稳定
#   psnr        ±1e-6   —— 唯一的超越函数 log10 在不同 libm 间可差最后几位
#   ms_ssim     ±1e-9   —— 纯四则 + 幂运算，与 numpy 定义性参照逐位对齐
#                          （scripts/msssim_reference.py），幂的跨平台 libm 差异
#                          在 1e-15 相对量级，1e-9 足够覆盖
#   butteraugli 相对 0.1% —— 与该 crate 自带 C++ 对照回归的容差同标准
#                          （其观测 FMA 噪声约 0.002%），绝对下限 1e-3 兜底
#                          近零分数（相同图为 0）
#   ssimulacra2 ±0.25   —— 与该 crate 官方测试同款绝对容差（其作者注明跨平台/
#                          跨运行的浮点与线程求和顺序差异），同机实测逐位稳定
# 容差故意收紧：指标算法一旦变化（哪怕是数字顺序），就应该显式重算并更新这里。

