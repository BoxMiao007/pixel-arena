[package]
name = "pixel-arena-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "像素竞技场命令行入口：一行命令批量跑分（score 子命令）"

[dependencies]
pixel-arena-core = { path = "../pixel-arena-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
serde_json = "1"
sha2 = "0.10"
