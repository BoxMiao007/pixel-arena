<!doctype html>

  </head>
  <body>

        <h1>像素竞技场</h1>

        <button id="add-round" class="add-btn" title="新建评测轮">＋ 新建评测轮</button>

      <section id="content" class="content"></section>

    <script type="module" src="/src/main.ts"></script>
